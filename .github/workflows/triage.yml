name: Repository triage

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    name: Apply project labels
    runs-on: ubuntu-latest
    steps:
      - name: Label by issue or pull request title
        uses: actions/github-script@v9
        with:
          script: |
            const isPr = context.eventName === "pull_request";
            const item = isPr ? context.payload.pull_request : context.payload.issue;
            const title = item.title || "";
            const labels = [
              { name: "needs-triage", color: "ededed", description: "Needs review and prioritisation" },
              { name: "roadmap", color: "5319e7", description: "Project roadmap and planning" },
              { name: "stability", color: "d73a4a", description: "Build, CI and reliability" },
              { name: "nutrition", color: "0e8a16", description: "Nutrition data and diary" },
              { name: "training", color: "1d76db", description: "Workout tracking and programming" },
              { name: "anatomy", color: "fbca04", description: "3D anatomy and assets" },
              { name: "studio", color: "c2e0c6", description: "Exercise animation studio" },
              { name: "privacy-security", color: "b60205", description: "Privacy, security and data protection" },
              { name: "accounts", color: "0052cc", description: "Authentication and profiles" },
              { name: "mobile", color: "bfd4f2", description: "PWA and mobile experience" },
              { name: "testing", color: "f9d0c4", description: "Automated and manual verification" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }

            const match = title.match(/^\[([^\]]+)\]/);
            const category = match ? match[1].toLowerCase() : "";
            const mapping = {
              roadmap: "roadmap",
              stability: "stability",
              nutrition: "nutrition",
              training: "training",
              anatomy: "anatomy",
              studio: "studio",
              privacy: "privacy-security",
              accounts: "accounts",
              mobile: "mobile",
              quality: "testing"
            };
            const selected = mapping[category];
            const desired = selected ? [selected] : ["needs-triage"];

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              labels: desired
            });
